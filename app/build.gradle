plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    namespace "io.bluedot.airshipdemo"
    compileSdk 36

    defaultConfig {
        applicationId "io.bluedot.airshipdemo"
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "BLUEDOT_PROJECT_ID", "\"${localProperties['bluedot.projectId'] ?: ''}\""
        buildConfigField "String", "AIRSHIP_APP_KEY", "\"${localProperties['airship.appKey'] ?: ''}\""
        buildConfigField "String", "AIRSHIP_APP_SECRET", "\"${localProperties['airship.appSecret'] ?: ''}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-compose:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // Jetpack Compose BOM
    def composeBom = platform('androidx.compose:compose-bom:2026.03.01')
    implementation composeBom
    androidTestImplementation composeBom

    // Compose UI
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Permissions
    implementation 'com.google.accompanist:accompanist-permissions:0.37.3'

    //Bluedot Point SDK
    implementation 'com.gitlab.bluedotio.android:point_sdk_android:17.4.1'

    def airshipVersion = "20.6.1"

    // ADM & FCM push providers
    implementation "com.urbanairship.android:urbanairship-fcm:$airshipVersion"
    implementation "com.urbanairship.android:urbanairship-adm:$airshipVersion"

    // In-App Messaging
    implementation "com.urbanairship.android:urbanairship-automation:$airshipVersion"

    // Message Center
    implementation "com.urbanairship.android:urbanairship-message-center:$airshipVersion"
}